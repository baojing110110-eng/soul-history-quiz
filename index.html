<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测测你的灵魂对应哪位中国历史人物</title><style>:root{--ink:#26332e;--gold:#b58b50;--paper:#f7f1e5}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Serif SC","Songti SC",serif;background:radial-gradient(circle at 15% 10%,#e7d8bb,transparent 30%),radial-gradient(circle at 90% 80%,#d6e0d4,transparent 35%),var(--paper);min-height:100vh}.wrap{max-width:760px;margin:auto;padding:22px 16px 50px}.card{position:relative;overflow:hidden;background:#fffaf0dc;border:1px solid #c9b895;box-shadow:0 20px 60px #3b352220;padding:clamp(24px,6vw,58px);border-radius:8px;min-height:540px}.card:before,.card:after{content:'✦';position:absolute;color:#b58b5055;font-size:70px}.card:before{top:-25px;right:15px}.card:after{bottom:-30px;left:15px}.eyebrow{letter-spacing:.35em;color:#947044;font-size:13px}h1{font-size:clamp(36px,7vw,62px);line-height:1.27;margin:22px 0}h2{font-size:clamp(24px,5vw,36px);line-height:1.45}.lead{line-height:2;color:#58645b}.seal{display:inline-grid;place-items:center;border:2px solid #9b4b3f;color:#9b4b3f;width:46px;height:46px;transform:rotate(-8deg);margin:30px 0}.button{border:0;background:#28483e;color:#fff;padding:15px 30px;font:inherit;letter-spacing:.16em;cursor:pointer;border-radius:3px;transition:.2s}.button:hover{background:#3f6758;transform:translateY(-2px)}.ghost{background:transparent;color:#466052;border:1px solid #9aa99c}.top{display:flex;justify-content:space-between;gap:10px;color:#947044;font-size:14px}.track{height:5px;background:#e8dfcc;margin:17px 0 40px;border-radius:9px}.bar{height:100%;background:#a77a42;transition:width .35s}.options{display:grid;gap:12px;margin:30px 0}.option{display:flex;align-items:center;gap:15px;width:100%;text-align:left;background:#f8f3e8;border:1px solid #ded0b7;padding:18px;font:inherit;color:var(--ink);cursor:pointer;border-radius:4px;transition:.2s}.option:hover,.option:focus{background:#e9edde;border-color:#809786;transform:translateX(4px)}.letter{color:#a67c45;font-weight:bold}.nav{display:flex;justify-content:space-between;margin-top:35px}.result{text-align:center}.role{color:#9c7340;letter-spacing:.3em}.name{font-size:clamp(50px,12vw,86px);margin:12px 0;color:#28483e}.quote{font-size:20px;line-height:1.7;color:#8d4d3c}.details{text-align:left;display:grid;gap:14px;margin:35px 0}.detail{background:#f4eddf;padding:16px 20px;line-height:1.8;border-left:3px solid #b58b50}.detail b{color:#835d32}.fade{animation:in .4s both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.foot{font-size:12px;color:#788178;margin-top:24px;line-height:1.7}@media(max-width:500px){.card{min-height:calc(100vh - 44px)}.option{padding:15px}.wrap{padding:12px}.nav{gap:10px}}</style></head><body><main class="wrap"><section id="app" class="card" aria-live="polite"></section></main><script>
const stems=[['周末突然空出半天，你会','补一份未来计划','约朋友出门走走','独自看书听歌','去尝试刺激的新活动'],['朋友临时改约，你通常','迅速调整安排','先关心对方情况','享受多出的独处时间','直接寻找新去处'],['遇到复杂任务，你先','拆解步骤与风险','召集伙伴分工','找灵感再动手','先试起来边做边改'],['聚会中你更像','观察气氛的人','带动全场的人','在角落深聊的人','提议下一站的人'],['收到不同意见时，你会','分析其中依据','理解对方立场','写下自己的想法','当场表达态度'],['旅行前你最在意','路线是否高效','同行者是否开心','风景是否有故事','有没有意外惊喜'],['压力大时你倾向','整理问题清单','找信任的人聊聊','安静消化情绪','运动或行动释放'],['理想的工作台是','井井有条','方便协作','有书与植物','随时可以出发'],['面对新机会，你先想','长期收益','能带来什么改变','是否合乎心意','是否值得冒险'],['别人向你求助，你会','给可执行的方案','陪他一起解决','认真倾听','立刻出手帮忙']];
const questions=Array.from({length:40},(_,i)=>{const s=stems[i%10];const scenes=['日常篇','处事篇','社交篇','情绪篇'][Math.floor(i/10)];return {title:(i>=10?['换个情境：','再想象一下：','如果今天重来：'][Math.floor(i/10)-1]:'')+s[0],options:s.slice(1),scene:scenes}});
const people=[{name:'诸葛亮',role:'谋士',axis:0,traits:'洞察、周全、沉稳',why:'你习惯先看清局势，再找到最稳妥的路径。',gift:'把混乱整理成清晰方向。',egg:'你的隐藏道具：一张永远画不完的行动地图。',quote:'风起之前，你已经听见了方向。'},{name:'武则天',role:'帝王',axis:1,traits:'果断、担当、掌控力',why:'你愿意凝聚众人，也敢为重要选择负责。',gift:'在关键时刻让团队相信自己。',egg:'你的隐藏道具：一枚写着“由我来”的印章。',quote:'你的舞台，从来不等别人点灯。'},{name:'苏轼',role:'文人',axis:2,traits:'通达、好奇、善于自洽',why:'你能在平凡片刻找到趣味，也懂得安放情绪。',gift:'把不如意酿成新的生活灵感。',egg:'你的隐藏道具：一份随时开席的菜单。',quote:'生活有风雨，你偏能尝出甜。'},{name:'李白',role:'诗人',axis:3,traits:'浪漫、自由、想象力',why:'你常被未知吸引，愿意用自己的节奏拥抱世界。',gift:'让寻常日子突然闪闪发光。',egg:'你的隐藏道具：一张没有终点的船票。',quote:'你一抬头，月亮就有了新名字。'},{name:'花木兰',role:'将领',axis:4,traits:'坚韧、行动、守护',why:'遇到需要挺身而出的时刻，你会用行动回应。',gift:'越是艰难，越能保持可靠。',egg:'你的隐藏道具：一双走过风雪的靴子。',quote:'你披上的勇气，比盔甲更亮。'},{name:'荆轲',role:'侠客',axis:5,traits:'重义、直接、勇敢',why:'你珍惜真诚关系，也敢为认定的事迈出一步。',gift:'在犹豫的人群里保有锋芒。',egg:'你的隐藏道具：一杯敬给朋友的热酒。',quote:'路远风急，你仍为所信而行。'},{name:'陶渊明',role:'隐士',axis:6,traits:'自省、自在、边界感',why:'你看重内心秩序，懂得为真正重要的事留白。',gift:'不被喧闹左右的定力。',egg:'你的隐藏道具：一方只属于自己的小庭院。',quote:'心有南山，哪里都是归处。'}];
let index=0,answers=Array(40).fill(null);const app=document.getElementById('app');function home(){app.innerHTML='<div class="fade"><div class="eyebrow">一卷性情 · 千年知音</div><div class="seal">人物</div><h1>测测你的灵魂<br>对应哪位<br>中国历史人物</h1><p class="lead">40 个生活里的小选择，遇见与你气质相近的古人。凭直觉作答，大约需要 5 分钟。</p><button class="button" id="start">开启性情之卷 →</button><p class="foot">趣味人格测试，仅供娱乐与分享。</p></div>';document.getElementById('start').onclick=()=>{index=0;answers=Array(40).fill(null);render()}}function render(){const q=questions[index];app.innerHTML='<div class="fade"><div class="top"><span>'+q.scene+'</span><span>第 '+(index+1)+' / 40 题</span></div><div class="track"><div class="bar" style="width:'+((index+1)/40*100)+'%"></div></div><div class="eyebrow">请凭第一感觉选择</div><h2>'+q.title+'</h2><div class="options">'+q.options.map((o,j)=>'<button class="option" data-choice="'+j+'"><span class="letter">'+('甲乙丙丁'[j])+'</span><span>'+o+'</span></button>').join('')+'</div><div class="nav"><button class="button ghost" id="back">'+(index?'上一题':'返回首页')+'</button><span class="foot">选择后自动进入下一题</span></div></div>';app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{answers[index]=Number(b.dataset.choice);if(index===39)result();else{index++;render()}});document.getElementById('back').onclick=()=>{if(index){index--;render()}else home()}}
function score(){const v=Array(7).fill(0);answers.forEach((a,i)=>{if(a===null)return;const offset=Math.floor(i/10);const mapping=[[0,2,1,3],[0,1,2,4],[0,1,6,5],[0,1,2,3]][offset];v[mapping[a]]+=3;if(a===0)v[0]++;if(a===1)v[1]++;if(a===2)v[i%2?6:2]++;if(a===3)v[i%2?5:3]++});return v.indexOf(Math.max(...v))}function result(){const p=people[score()];app.innerHTML='<div class="result fade"><div class="eyebrow">千年知音 · 性情揭晓</div><div class="seal">有缘</div><div class="role">你的灵魂人物 · '+p.role+'</div><div class="name">'+p.name+'</div><div class="quote">“'+p.quote+'”</div><div class="details"><div class="detail"><b>性格特点</b><br>'+p.traits+'</div><div class="detail"><b>匹配理由</b><br>'+p.why+'</div><div class="detail"><b>隐藏优势</b><br>'+p.gift+'</div><div class="detail"><b>趣味彩蛋</b><br>'+p.egg+'</div></div><button class="button" id="again">重新测试</button><p class="foot">截图保存这张结果卡，分享你的千年知音。<br>本测试仅供娱乐，不构成心理诊断。</p></div>';document.getElementById('again').onclick=home;window.scrollTo({top:0,behavior:'smooth'})}home();
</script></body></html>
